<header>
Employee Management System
</header>

<div class="container">

<div class="card">

<h2>Add / Update Employee</h2>

<div class="form-group">

<input id="studentId" hidden>

<input id="fname" placeholder="First Name">

<input id="lname" placeholder="Last Name">

<input id="email" placeholder="Email">

</div>

<div class="buttons">

<button class="add-btn" onclick="addStudent()">Add Employee</button>

<button class="update-btn" onclick="updateStudent()">Update Employee</button>

<button class="clear-btn" onclick="clearForm()">Clear</button>

</div>

</div>

<div class="card">

<h2>Employee</h2>

<table>

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="Employee"></tbody>

</table>

</div>

</div>

<div class="footer">
Production DevOps Platform • AWS • EKS • GitHub Actions • Terraform
</div>
