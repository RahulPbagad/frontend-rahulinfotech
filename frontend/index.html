<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    Employee Management System
</header>

<div class="container">

    <div class="card">

        <h2>Add / Update Employee</h2>

        <div class="form-group">

            <input type="hidden" id="studentId">

            <input type="text" id="fname" placeholder="First Name">

            <input type="text" id="lname" placeholder="Last Name">

            <input type="email" id="email" placeholder="Email">

        </div>

        <div class="buttons">

            <button class="add-btn" onclick="addStudent()">Add Employee</button>

            <button class="update-btn" onclick="updateStudent()">Update Employee</button>

            <button class="clear-btn" onclick="clearForm()">Clear</button>

        </div>

    </div>

    <div class="card">

        <h2>Employee List</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

</div>

<div class="footer">
Production DevOps Platform • AWS • Terraform • EKS • GitHub Actions
</div>

<script src="app.js"></script>

</body>

</html>
